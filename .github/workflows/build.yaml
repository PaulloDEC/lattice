name: Build Hocus

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev

      - name: Compile hocus
        working-directory: port
        run: make -j$(nproc)

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: hocus-linux
          path: port/hocus

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-SDL2

      - name: Compile hocus for Windows
        shell: msys2 {0}
        working-directory: port
        run: mingw32-make CC=gcc SDL_CONFIG=/ucrt64/bin/sdl2-config -j$(nproc)

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: hocus-windows
          path: port/hocus*

  publish-release:
    runs-on: ubuntu-latest
    needs: [ build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          cp artifacts/hocus-linux/hocus release_assets/hocus-linux
          chmod +x release_assets/hocus-linux

          # Handle Windows output whether named hocus.exe or hocus
          if [ -f artifacts/hocus-windows/hocus.exe ]; then
            cp artifacts/hocus-windows/hocus.exe release_assets/hocus-windows.exe
          elif [ -f artifacts/hocus-windows/hocus ]; then
            cp artifacts/hocus-windows/hocus release_assets/hocus-windows.exe
          fi

          ls -la release_assets/

      - name: Create Release and upload binaries
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_assets/hocus-linux
            release_assets/hocus-windows.exe
          generate_release_notes: true