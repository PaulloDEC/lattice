name: Build Hocus

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev

      - name: Compile hocus
        working-directory: port
        run: make -j$(nproc)

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: hocus-linux
          path: port/hocus

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-SDL2

      - name: Compile hocus for Windows
        shell: msys2 {0}
        working-directory: port
        run: mingw32-make CC=gcc SDL_CONFIG=/ucrt64/bin/sdl2-config -j$(nproc)

      - name: Copy SDL2 runtime DLL
        shell: msys2 {0}
        working-directory: port
        run: cp /ucrt64/bin/SDL2.dll .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: hocus-windows
          path: |
            port/hocus*
            port/SDL2.dll

  publish-release:
    runs-on: ubuntu-latest
    needs: [ build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code (for the SoundFont)
        uses: actions/checkout@v4

      - name: Install zip tool
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets win_bundle linux_bundle
          cp artifacts/hocus-linux/hocus linux_bundle/hocus
          chmod +x linux_bundle/hocus

          # Handle Windows output whether named hocus.exe or hocus
          if [ -f artifacts/hocus-windows/hocus.exe ]; then
            cp artifacts/hocus-windows/hocus.exe win_bundle/hocus.exe
          elif [ -f artifacts/hocus-windows/hocus ]; then
            cp artifacts/hocus-windows/hocus win_bundle/hocus.exe
          fi

          cp artifacts/hocus-windows/SDL2.dll win_bundle/SDL2.dll

          # General MIDI music: the SoundFont and its licence go next to the program in both downloads
          for b in win_bundle linux_bundle; do
            cp port/GeneralUser-GS.sf2 port/GeneralUser-GS-LICENSE.txt $b/
          done

          (cd win_bundle && zip -r ../release_assets/hocus-windows.zip hocus.exe SDL2.dll GeneralUser-GS.sf2 GeneralUser-GS-LICENSE.txt)
          (cd linux_bundle && zip -r ../release_assets/hocus-linux.zip hocus GeneralUser-GS.sf2 GeneralUser-GS-LICENSE.txt)
          ls -la release_assets/

      - name: Create Release and upload binaries
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_assets/hocus-linux.zip
            release_assets/hocus-windows.zip
          generate_release_notes: true