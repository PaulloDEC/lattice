name: Build Hocus

# When this automation runs
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Adds a manual "Run workflow" button in the Actions tab

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository code onto the GitHub build machine
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install the C compiler and SDL2 development files
      - name: Install build tools and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev

      # 3. Run your Makefile inside the port/ folder
      - name: Compile hocus
        working-directory: port
        run: make -j$(nproc)

      # 4. Save the compiled "hocus" file so you can download it from GitHub
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: hocus-linux
          path: port/hocus

build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs MSYS2 and the 64-bit MinGW GCC compiler + SDL2 package
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-SDL2

      - name: Compile hocus for Windows
        shell: msys2 {0}
        working-directory: port
        run: make CC=x86_64-w64-mingw32-gcc SDL_CONFIG=/mingw64/bin/sdl2-config -j$(nproc)

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: hocus-windows
          path: port/hocus*